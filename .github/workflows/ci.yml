name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
    DATABASE_URL: postgresql://postgres.xybhiplccwoamsdkruzh:ShowCase1234@aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{matrix.node-version}}

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test
